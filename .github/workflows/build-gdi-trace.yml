name: Build NOBU6HD GDI trace tool

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "tools/gdi_trace/**"
      - ".github/workflows/build-gdi-trace.yml"
  pull_request:
    paths:
      - "tools/gdi_trace/**"
      - ".github/workflows/build-gdi-trace.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build Win32 Release
        shell: cmd
        run: msbuild tools\\gdi_trace\\NOBU6HD_GDI_Trace.sln /m /p:Configuration=Release /p:Platform=Win32
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item tools/gdi_trace/bin/Win32/Release/HookDLL.dll dist/
          Copy-Item tools/gdi_trace/bin/Win32/Release/Injector.exe dist/
          Copy-Item tools/gdi_trace/README.md dist/README.txt
          Compress-Archive -Path dist/* -DestinationPath NOBU6HD_GDI_Trace_Win32.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOBU6HD_GDI_Trace_Win32
          path: NOBU6HD_GDI_Trace_Win32.zip
