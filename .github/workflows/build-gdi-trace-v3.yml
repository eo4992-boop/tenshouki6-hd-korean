name: Build NOBU6HD GDI Trace V3
on:
  push:
    paths:
      - "tools/gdi_trace_v3/**"
      - ".github/workflows/build-gdi-trace-v3.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure Win32
        run: cmake -S tools/gdi_trace_v3 -B build/gdi_trace_v3 -A Win32
      - name: Build
        run: cmake --build build/gdi_trace_v3 --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/gdi_trace_v3/Release/NOBU6HD_GDI_Trace_V3.exe dist/
          Copy-Item build/gdi_trace_v3/Release/NOBU6HD_GDI_TRACE_V3.dll dist/
          Copy-Item tools/gdi_trace_v3/README.md dist/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOBU6HD_GDI_Trace_V3_Win32
          path: dist/
