name: Build NOBU6HD GDI Trace V3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tools/gdi_trace_v3 -B build/gdi_trace_v3 -A x64
      - name: Build
        run: cmake --build build/gdi_trace_v3 --config Release
      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item build/gdi_trace_v3/Release/NOBU6HD_GDI_TRACE_V3.dll dist/
          Copy-Item tools/gdi_trace_v3/README.md dist/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOBU6HD-GDI-TRACE-V3
          path: dist/
